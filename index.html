<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2030">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>will@heytherewill</title>
    <style>
      @font-face {
        font-family: "JetBrainsMono Nerd Font";
        src: url("assets/JetBrainsMonoNerdFontMono-Regular.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --base: #1e2030;
        --mantle: #181926;
        --surface: #24273a;
        --overlay: #6e738d;
        --subtext: #a5adcb;
        --text: #cad3f5;
        --blue: #8aadf4;
        --mauve: #c6a0f6;
        --green: #a6da95;
        --peach: #f5a97f;
        --red: #ed8796;
        --prompt-color: #7dc4e4;
        --titlebar-border: #36394e;
      }

      body.theme-light {
        --base: #eff1f5;
        --mantle: #e6e9ef;
        --surface: #dce0e8;
        --overlay: #8c8fa1;
        --subtext: #6c6f85;
        --text: #4c4f69;
        --blue: #1e66f5;
        --mauve: #8839ef;
        --green: #40a02b;
        --peach: #fe640b;
        --red: #d20f39;
        --prompt-color: #1e66f5;
        --titlebar-border: #bcc0cc;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--mantle);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--base);
        color: var(--text);
        font: 36px / 1.65 "JetBrainsMono Nerd Font", ui-monospace, SFMono-Regular,
          Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .window {
        display: flex;
        width: 100vw;
        min-height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        background: var(--base);
      }

      .titlebar {
        display: flex;
        height: 48px;
        flex: 0 0 auto;
        align-items: center;
        padding: 0 17px;
        border-bottom: 1px solid var(--titlebar-border);
        background: color-mix(in srgb, var(--surface) 84%, var(--mantle));
        user-select: none;
      }

      .traffic-lights {
        display: flex;
        gap: 8px;
      }

      .traffic-lights span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .traffic-lights span:nth-child(1) {
        background: #ed8796;
      }

      .traffic-lights span:nth-child(2) {
        background: #eed49f;
      }

      .traffic-lights span:nth-child(3) {
        background: #a6da95;
      }

      .title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: var(--subtext);
        font-size: 13px;
      }

      #terminal {
        flex: 1;
        overflow-y: auto;
        padding-top: 25px;
        padding-right: max(clamp(18px, 4vw, 42px), env(safe-area-inset-right));
        padding-bottom: max(25px, env(safe-area-inset-bottom));
        padding-left: max(clamp(18px, 4vw, 42px), env(safe-area-inset-left));
        scrollbar-color: var(--overlay) transparent;
      }

      .line {
        min-height: 1.25em;
        line-height: 1.25;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .command {
        display: block;
      }

      .prompt {
        white-space: pre;
      }

      .prompt-decoration,
      .prompt-path {
        color: var(--prompt-color);
      }

      .command-prefix {
        margin-right: 1ch;
      }

      .command-text {
        color: var(--text);
        white-space: pre-wrap;
      }

      .output {
        margin: 0 0 24px;
      }

      .command-complete {
        margin-bottom: 44px;
      }

      .muted {
        color: var(--subtext);
      }

      .directory {
        color: var(--blue);
        font-weight: 700;
      }

      .file {
        color: var(--mauve);
      }

      .executable {
        color: var(--green);
      }

      .error {
        color: var(--red);
        line-height: 1.25;
      }

      .accent {
        color: var(--peach);
      }

      .file-link {
        display: inline-flex;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 0.35ch;
        border: 1px dotted transparent;
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
        text-decoration: none;
        touch-action: manipulation;
      }

      .file-link:hover,
      .file-link:focus-visible,
      .file-link:active {
        border-color: currentColor;
        outline: none;
      }

      .file-link:active {
        background: color-mix(in srgb, currentColor 15%, transparent);
      }

      .input-row {
        min-height: 0;
        line-height: 1.25;
      }

      #prompt {
        display: block;
      }

      .command-input-line {
        display: flex;
        align-items: baseline;
      }

      #command-input {
        min-width: 1ch;
        flex: 1;
        border: 0;
        outline: 0;
        padding: 0;
        background: transparent;
        caret-color: var(--mauve);
        color: var(--text);
        font: inherit;
        font-size: max(16px, 1em);
      }

      #command-input::placeholder {
        color: transparent;
      }

      .autocomplete {
        display: none;
      }

      .hint {
        margin-top: 7px;
        color: var(--overlay);
        font-size: 24px;
      }

      @media (max-width: 560px) {
        .titlebar {
          height: 44px;
          padding-right: max(12px, env(safe-area-inset-right));
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .traffic-lights {
          gap: 6px;
        }

        .traffic-lights span {
          width: 10px;
          height: 10px;
        }

        #terminal {
          padding-top: 18px;
          padding-right: max(16px, env(safe-area-inset-right));
          padding-bottom: max(20px, env(safe-area-inset-bottom));
          padding-left: max(16px, env(safe-area-inset-left));
          font-size: 16px;
        }

        .output {
          margin-bottom: 18px;
        }

        .command-complete {
          margin-bottom: 28px;
        }

        .hint {
          margin-top: 10px;
          font-size: 14px;
        }

        .autocomplete:not([hidden]) {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 12px;
        }

        .autocomplete-option {
          min-height: 44px;
          border: 1px solid var(--titlebar-border);
          border-radius: 5px;
          padding: 0 12px;
          background: var(--surface);
          color: var(--text);
          font: inherit;
          font-size: 14px;
          touch-action: manipulation;
        }

        .autocomplete-option:active {
          border-color: var(--blue);
          background: color-mix(in srgb, var(--blue) 20%, var(--surface));
        }

        .tree-output .file-link {
          display: inline;
          min-width: 0;
          min-height: 0;
          padding: 0;
        }

        .title {
          font-size: 12px;
        }
      }

      @media (max-width: 400px) {
        .title {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="window" aria-label="Terminal navigation">
      <header class="titlebar">
        <div class="traffic-lights">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="title">will — pwsh — 80×24</span>
      </header>

      <section id="terminal" aria-live="polite">
        <div id="history"></div>

        <form id="terminal-form" class="input-row" autocomplete="off">
          <label id="prompt" class="prompt" for="command-input">
            <span class="prompt-decoration">┌ </span>
            <span class="prompt-path">~</span>
          </label>
          <div class="command-input-line">
            <span class="prompt-decoration command-prefix">└ $</span>
            <input
              id="command-input"
              type="text"
              spellcheck="false"
              autocapitalize="none"
              autocorrect="off"
              autofocus
              aria-label="Terminal command"
              autocomplete="off"
              enterkeyhint="send"
              inputmode="text"
            >
          </div>
          <div
            id="autocomplete"
            class="autocomplete"
            role="listbox"
            aria-label="Command suggestions"
            hidden
          ></div>
        </form>

        <div class="hint">Type <span class="accent">help</span> to get started</div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
